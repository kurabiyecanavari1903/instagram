<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
    <title>Instagram</title>
    <link rel="icon" href="/src/images/Instagram_icon.png" />
  </head>
  <body>
    <div class="grid grid-cols-12">
      <!-- Left -->
      <div class="col-span-7 text-4xl space-y-10 relative hidden md:block">
        <div class="h-full flex flex-col justify-center items-center">
          <p class="text-4xl text-center font-semibold leading-16 mx-52">
            <span
              class="bg-linear-to-r from-lime-200 to-rose-500 bg-clip-text text-transparent"
            >
              Yakın arkadaşlarının
            </span>
            günlük anlarını gör.
          </p>
          <img src="./images/sol.webp" alt="" class="w-3/6 mx-auto" />
        </div>
        <img
          src="./images/Ny6hrBVLYjl.jpg"
          alt=""
          class="absolute top-12 left-12 w-20"
        />
      </div>
      <!-- Right -->
      <div
        class="col-span-12 md:col-span-5 border-l-3 border-gray-300 relative flex items-center justify-center py-24"
      >
        <form class="flex flex-col items-stretch gap-4" action="">
          <p class="font-semibold">Instagram'a Giriş Yap</p>
          <input
            class="h-12 rounded-xl px-2 border border-gray-300"
            type="text"
            id="isim"
            placeholder="Cep telefonu numarası, kullanıcı adı veya e-posta adresi"
          />
          <input
            class="h-12 rounded-xl px-2 border border-gray-300"
            type="password"
            id="sifre"
            placeholder="Şifre"
          />

          <button class="h-11 bg-blue-300 rounded-4xl mt-4">
            <span class="text-white">Giriş Yap</span>
          </button>

          <button class="bg-white hover:bg-gray-100 rounded-full px-45 py-3">
            <p class="font-semibold">Şifreni mi unuttun?</p>
          </button>

          <button
            class="h-11 hover:bg-gray-100 border border-gray-200 rounded-4xl mt-10"
          >
            <span class="font-semibold flex justify-center gap-1">
              <img
                src="/src/images/facebook-circle-logo-icon-fb-app-transparent-background-premium-social-media-design-for-digital-download-free-png.webp"
                alt=""
                class="w-6 h-6 translate-y-0.5"
              />

              Facebook ile giriş yap</span
            >
          </button>

          <button
            class="h-11 hover:bg-gray-100 border border-blue-500 rounded-4xl"
          >
            <span class="text-blue-500 font-semibold flex justify-center"
              >Yeni hesap oluştur</span
            >
          </button>
          <img src="/src/images/Meta-Logo.png" alt="" class="w-15 mx-auto" />
        </form>
      </div>
    </div>

    <footer
      class="border-t h-30 border-gray-300 flex flex-wrap gap-4 items-center justify-center underline px-30"
    >
